<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-labelledby="t d"><title id="t">Envelope filter</title><desc id="d">The envelope filter's cutoff against time: it sits at 300 Hz for a quiet input and rises towards 3 kHz within tens of milliseconds of a loud one.</desc><rect x="0.5" y="0.5" width="439" height="289" rx="10" fill="#201A12" stroke="#3A3226"/><text x="52" y="24" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#EDE6D8">Envelope filter</text><text x="52" y="40" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A89878">cutoff after a quiet-to-loud step at 0 ms (lo 300 Hz, hi 3 kHz, attack 5 ms)</text><line x1="52" y1="219.7" x2="424" y2="219.7" stroke="#2C251B"/><text x="46" y="223.7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="end">300</text><line x1="52" y1="141.8" x2="424" y2="141.8" stroke="#2C251B"/><text x="46" y="145.8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="end">1000</text><line x1="52" y1="70.6" x2="424" y2="70.6" stroke="#2C251B"/><text x="46" y="74.6" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="end">3000</text><line x1="105.1" y1="52" x2="105.1" y2="246" stroke="#2C251B"/><text x="105.1" y="261" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="middle">0</text><line x1="211.4" y1="52" x2="211.4" y2="246" stroke="#2C251B"/><text x="211.4" y="261" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="middle">10</text><line x1="317.7" y1="52" x2="317.7" y2="246" stroke="#2C251B"/><text x="317.7" y="261" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="middle">20</text><line x1="424" y1="52" x2="424" y2="246" stroke="#2C251B"/><text x="424" y="261" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#A89878" text-anchor="middle">30</text><text x="238" y="282" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A89878" text-anchor="middle">time since the step (ms)</text><text transform="translate(13 149) rotate(-90)" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#A89878" text-anchor="middle">cutoff (Hz)</text><path d="M55.5 217.6 L62.6 217.6 L69.7 217.6 L76.8 217.6 L83.9 217.6 L91 217.6 L98.1 217.6 L105.1 217.6 L112.2 183 L119.3 141.1 L126.4 95.3 L133.5 75.7 L140.6 70.6 L147.7 70.6 L154.7 70.6 L161.8 70.6 L168.9 70.6 L176 70.6 L183.1 70.6 L190.2 70.6 L197.3 70.6 L204.3 70.6 L211.4 70.6 L218.5 70.6 L225.6 70.6 L232.7 70.6 L239.8 70.6 L246.9 70.6 L253.9 70.6 L261 70.6 L268.1 70.6 L275.2 70.6 L282.3 70.6 L289.4 70.6 L296.5 70.6 L303.5 70.6 L310.6 70.6 L317.7 70.6 L324.8 70.6 L331.9 70.6 L339 70.6 L346.1 70.6 L353.1 70.6 L360.2 70.6 L367.3 70.6 L374.4 70.6 L381.5 70.6 L388.6 70.6 L395.7 70.6 L402.7 70.6 L409.8 70.6 L416.9 70.6 L424 70.6" fill="none" stroke="#D4A93F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
